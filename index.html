<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBus Tracker - Student Tracking</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <!-- Firebase SDK (Compat versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <span style="font-size: 1.4rem;">🚌</span>
            <h1>UniBus Tracker</h1>
        </div>
        <nav>
            <a href="index.html" class="active">Student Map</a>
            <a href="login.html">Portal Login</a>
        </nav>
    </header>

    <main>
        <div class="tracking-grid">
            <!-- Sidebar Controls -->
            <div class="panel">
                <div>
                    <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Trip Status</span>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.35rem;">
                        <h2 style="font-size: 1.25rem;" id="bus-name-display">Campus Shuttle #1</h2>
                        <span class="badge badge-offline" id="bus-status-badge">
                            <span class="badge-dot"></span>
                            <span id="bus-status-text">Offline</span>
                        </span>
                    </div>
                </div>

                <hr style="border: none; border-top: 1px solid var(--border);">

                <!-- Pickup Stop Selector -->
                <div>
                    <label for="stop-selector" style="font-weight: 600; font-size: 0.9rem;">Select Your Pickup Stop</label>
                    <select id="stop-selector" style="margin-top: 0.4rem;">
                        <option value="">-- Choose your pickup stop --</option>
                    </select>
                </div>

                <!-- Live ETA Card -->
                <div class="eta-highlight">
                    <div class="eta-label">Estimated Arrival Time</div>
                    <div class="eta-value" id="eta-display">-- min</div>
                    <div class="eta-sub" id="eta-details">Select a pickup stop to view estimated arrival</div>
                </div>

                <!-- Route & Telemetry Summary -->
                <div style="margin-top: auto; font-size: 0.85rem; color: var(--text-muted); background: var(--bg-light); padding: 0.85rem; border-radius: var(--radius);">
                    <p><strong>Route:</strong> Campus ↔ City Center</p>
                    <p style="margin-top: 0.3rem;"><strong>Last Synced:</strong> <span id="last-updated-text">Awaiting bus signal...</span></p>
                </div>
            </div>

            <!-- Map View -->
            <div class="map-container" id="map"></div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
