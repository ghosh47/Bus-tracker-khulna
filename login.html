<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBus Tracker - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
    
    <!-- Firebase SDK (Compat versions for direct browser usage) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <span style="font-size: 1.4rem;">🚌</span>
            <h1>UniBus Tracker</h1>
        </div>
        <nav>
            <a href="index.html">Student Map</a>
            <a href="login.html" class="active">Portal Login</a>
        </nav>
    </header>

    <main style="max-width: 440px; margin-top: 2.5rem;">
        <div class="card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <span style="font-size: 2.5rem;">🔐</span>
                <h2 style="font-size: 1.4rem; margin-top: 0.5rem;">Staff & Driver Portal</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">
                    Sign in to access driver telemetry or admin management
                </p>
            </div>

            <!-- Error message container -->
            <div id="login-error" class="alert alert-error" style="margin-bottom: 1rem;">
                Invalid credentials. Please try again.
            </div>

            <form id="login-form">
                <div style="margin-bottom: 1rem;">
                    <label for="email">Institutional Email</label>
                    <input type="email" id="email" placeholder="driver@unibus.edu or admin@unibus.edu" required autocomplete="email">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" style="width: 100%;" id="login-submit-btn">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="index.html" style="font-size: 0.85rem; color: var(--accent); text-decoration: none;">
                    ← Back to Student Tracking
                </a>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
